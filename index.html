<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exercise 09</title>
<style>
  body {
    background: white;
    margin: 20px;
  }

  .card {
    width: 420px;
    padding: 20px;
    box-shadow: 0 0 12px rgba(0, 0, 0, 0.4);
  }

  h2 {
    margin: 0 0 20px 0;
    padding: 6px 8px;
    font-family: "Times New Roman", serif;
    font-size: 22px;
    color: black;
  }
  h2:last-child {
    margin-bottom: 0;
  }

  .box1 {
    background-color: lightblue;
    border: 6px double tomato;
  }

  .box2 {
    background-color: yellow;
    border: 2px solid dodgerblue;
    border-radius: 8px;
  }

  .box3 {
    background-color: mediumseagreen;
    border: 8px dotted gray;
  }
</style>
</head>
<body>
  <div class="card">
    <h2 class="box1">Hello World</h2>
    <h2 class="box2">Hello World</h2>
    <h2 class="box3">Hello World</h2>
  </div>
</body>
</html>
